# =============================================================================
# HTTPS（Let's Encrypt 签给裸 IP 的短效证书，无域名、无备案）
#   证书：/etc/nginx/ssl/ip/  由 acme.sh 每 3 天左右自动续签并 reload（/etc/cron.d/acme-renew）
#   本文件与 spring-blog-80.conf 规则一致，只是多了 TLS；upstream 只在 spring-blog.conf 里定义一次
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ip/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    root /opt/spring-blog/static;
    client_max_body_size 20m;

    access_log /var/log/nginx/spring-blog-https.access.log;
    error_log  /var/log/nginx/spring-blog-https.error.log;

    # 证书续签用（走 80，这里顺带也放开）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /js/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location /uploads/ {
        alias /opt/spring-blog/data/uploads/;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://spring_blog;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # AI 流式对话与站内通知 SSE：必须关闭缓冲
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
