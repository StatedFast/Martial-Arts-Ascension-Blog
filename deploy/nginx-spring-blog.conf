# =============================================================================
# Nginx 反代 + 静态资源缓存 + gzip
#
# 架构：浏览器 → Nginx(80 / 8081) → Spring Boot(127.0.0.1:8090)
#   静态资源（/css /js /images /uploads）由 Nginx 直接读盘，带强缓存，不经过 Java
#   动态请求反代到 8090；SSE（AI 对话、站内通知）关闭缓冲
#
# 启用步骤：
#   dnf install -y unzip nginx
#   # 1. 把 jar 里的静态资源抽到磁盘（Nginx 的 root 指向这里）
#   mkdir -p /opt/spring-blog/static && cd /tmp && rm -rf ext && mkdir ext
#   unzip -q /opt/spring-blog/app.jar "BOOT-INF/classes/static/*" -d /tmp/ext
#   cp -r /tmp/ext/BOOT-INF/classes/static/. /opt/spring-blog/static/
#   chown -R springblog:springblog /opt/spring-blog/static
#   # 2. 应用让出 8081，改监听 8090
#   sed -i 's/^SERVER_PORT=.*/SERVER_PORT=8090/' /opt/spring-blog/app.env
#   systemctl restart spring-blog
#   # 3. 启用 Nginx
#   cp nginx-spring-blog.conf /etc/nginx/conf.d/spring-blog.conf
#   nginx -t && systemctl enable --now nginx
#
# 说明：如果同时要用 80 和 8081，把本文件的 server 块复制一份，只改 listen 即可；
#       upstream 只能定义一次，第二份里删掉 upstream 段。
#       安全组需放行 80/tcp 与 8081/tcp。
# =============================================================================

upstream spring_blog {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 8081;
    server_name _;

    # ---------- gzip：文本类资源压缩传输（CSS 65KB → 14KB） ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    root /opt/spring-blog/static;
    client_max_body_size 20m;

    access_log /var/log/nginx/spring-blog.access.log;
    error_log  /var/log/nginx/spring-blog.error.log;

    # ---------- 静态资源：Nginx 直接读盘 + 强缓存 ----------
    location /css/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /js/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 图片 30 天强缓存（文件名不变，改图后需改引用或换文件名）
    location /images/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 用户上传的图片（头像等），由应用写入磁盘，Nginx 直接读
    location /uploads/ {
        alias /opt/spring-blog/data/uploads/;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 动态请求：反代到 Spring Boot ----------
    location / {
        proxy_pass http://spring_blog;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # AI 流式对话与站内通知 SSE：必须关闭缓冲，否则会被攒到最后一次性吐出
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
