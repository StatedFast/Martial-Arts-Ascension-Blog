# =============================================================================
# 可选：Nginx 反向代理，对外只暴露 80，应用仍监听 127.0.0.1:8081
#
# 启用步骤：
#   dnf install -y nginx
#   cp nginx-spring-blog.conf /etc/nginx/conf.d/spring-blog.conf
#   # 把 server_name 改成你的域名，没有域名就填公网 IP
#   nginx -t && systemctl enable --now nginx
#
# 注意：国内 ECS 用 80/443 接域名需要域名已备案；只用 IP 访问可直接用 8081，无需本文件。
# =============================================================================
server {
    listen       80;
    server_name  118.31.186.244;

    # 与 spring.servlet.multipart.max-request-size=20MB 对齐
    client_max_body_size 20m;

    access_log /var/log/nginx/spring-blog.access.log;
    error_log  /var/log/nginx/spring-blog.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接交给后端自己管理（SSE 需要）
        proxy_set_header Connection        "";

        # AI 流式对话与站内通知 SSE：必须关闭缓冲，否则响应会被 Nginx 攒到最后一次性吐出
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
