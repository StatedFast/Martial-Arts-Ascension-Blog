<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 修仙心得</title>
    <link rel="stylesheet" href="/css/style.css?v=14">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">📝 修仙心得</a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="container">
        <div class="main-content">
            <!-- 个人信息卡片 -->
            <div class="card profile-header">
                <div class="profile-avatar-container">
                    <img src="" id="profileAvatar" class="profile-avatar" alt="头像"
                         onerror="this.onerror=null;this.src='/images/default-avatar.svg'">
                    <button class="avatar-edit-btn" onclick="showAvatarModal()">📷</button>
                </div>
                <h2 id="profileNickname">加载中...</h2>
                <p id="profileBio" style="color:var(--text-light)"></p>
                <div class="author-stats">
                    <div class="stat-item">
                        <div class="stat-num" id="articleCount">0</div>
                        <div class="stat-label">文章</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="commentCount">0</div>
                        <div class="stat-label">评论</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="likeCount">0</div>
                        <div class="stat-label">获赞</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="viewCount">0</div>
                        <div class="stat-label">阅读</div>
                    </div>
                </div>
            </div>

            <!-- Tab切换 -->
            <div class="card">
                <div class="profile-tabs">
                    <div class="profile-tab active" onclick="switchTab(this, 'info')">基本信息</div>
                    <div class="profile-tab" onclick="switchTab(this, 'password')">修改密码</div>
                    <div class="profile-tab" onclick="switchTab(this, 'articles')">我的文章</div>
                    <div class="profile-tab" onclick="switchTab(this, 'favorites')">我的收藏</div>
                    <div class="profile-tab" onclick="switchTab(this, 'likes')">我的点赞</div>
                    <div class="profile-tab" onclick="switchTab(this, 'comments')">我的评论</div>
                </div>

                <!-- 基本信息 -->
                <div id="tab-info" class="tab-content" style="padding:20px;">
                    <form onsubmit="updateProfile(event)">
                        <div class="form-group">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-control" id="editNickname" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>
                        <div class="form-group">
                            <label class="form-label">个人简介</label>
                            <textarea class="form-control" id="editBio" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </form>
                </div>

                <!-- 修改密码 -->
                <div id="tab-password" class="tab-content" style="display:none; padding:20px;">
                    <form onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label class="form-label">原密码</label>
                            <input type="password" class="form-control" id="oldPassword" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary">修改密码</button>
                    </form>
                </div>

                <!-- 我的文章 -->
                <div id="tab-articles" class="tab-content" style="display:none; padding:20px;">
                    <div class="tab-pane" data-loaded="false" id="pane-articles">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- 我的收藏 -->
                <div id="tab-favorites" class="tab-content" style="display:none; padding:20px;">
                    <div class="tab-pane" data-loaded="false" id="pane-favorites">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- 我的点赞 -->
                <div id="tab-likes" class="tab-content" style="display:none; padding:20px;">
                    <div class="tab-pane" data-loaded="false" id="pane-likes">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- 我的评论 -->
                <div id="tab-comments" class="tab-content" style="display:none; padding:20px;">
                    <div class="tab-pane" data-loaded="false" id="pane-comments">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 头像编辑弹窗 -->
    <div class="modal-overlay" id="avatarModal">
        <div class="modal-box">
            <h3 class="modal-title">修改头像</h3>
            <div class="form-group">
                <label class="form-label">选择本地图片</label>
                <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp"
                       style="width:100%; padding:8px; border:1px solid var(--border,#ddd); border-radius:8px;">
                <div style="margin-top:6px; font-size:12px; opacity:.7;">支持 jpg/png/gif/webp/bmp，不超过 2MB</div>
                <img id="avatarPreview" alt="预览" style="display:none; width:80px; height:80px; border-radius:50%; object-fit:cover; margin-top:10px;">
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn btn-outline" onclick="closeAvatarModal()">取消</button>
                <button class="btn btn-primary" onclick="updateAvatar()">确定</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=7"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login';
        }

        let currentUser = null;

        // 加载用户信息（后端返回白名单 VO，不再直接暴露 User 实体）
        async function loadProfile() {
            try {
                const user = await http.get('/user/profile');
                currentUser = user;
                document.getElementById('profileNickname').textContent = user.nickname;
                document.getElementById('profileBio').textContent = user.bio || '这个人很懒，什么都没写...';
                document.getElementById('profileAvatar').src = user.avatar || '/images/default-avatar.svg';
                document.getElementById('editNickname').value = user.nickname || '';
                document.getElementById('editEmail').value = user.email || '';
                document.getElementById('editBio').value = user.bio || '';

                document.getElementById('articleCount').textContent = user.articleCount ?? 0;
                document.getElementById('commentCount').textContent = user.commentCount ?? 0;
                document.getElementById('likeCount').textContent = user.likeCount ?? 0;
                document.getElementById('viewCount').textContent = user.viewCount ?? 0;
            } catch (e) {
                Toast.show(e.message, 'error');
            }
        }

        // Tab切换：首次进入某个 tab 时才请求数据，避免一次性并发 4 个接口
        function switchTab(el, tab) {
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            el.classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';

            const pane = document.getElementById('pane-' + tab);
            if (!pane || pane.dataset.loaded === 'true') return;

            if (tab === 'articles') loadMyArticles(pane);
            if (tab === 'favorites') loadRelationArticles(pane, '/user/favorites', '还没有收藏任何文章');
            if (tab === 'likes') loadRelationArticles(pane, '/user/likes', '还没有点赞过任何文章');
            if (tab === 'comments') loadMyComments(pane);
        }

        function articleRow(a) {
            return `<div class="article-item">
                <div class="article-title">
                    <a href="/article/${a.id}">${escapeHtml(a.title)}</a>
                    ${a.status === 0 ? '<span class="draft-badge">草稿</span>' : ''}
                </div>
                <div class="article-meta">
                    <span>${formatTime(a.createTime)}</span>
                    <span>${a.viewCount || 0} 阅读</span>
                    <span>${a.commentCount || 0} 评论</span>
                    <span>${a.likeCount || 0} 点赞</span>
                    <span>${a.favoriteCount || 0} 收藏</span>
                </div>
            </div>`;
        }

        function emptyState(text, actionHtml = '') {
            return `<div class="empty-state"><h3>${text}</h3>${actionHtml}</div>`;
        }

        async function loadMyArticles(pane) {
            try {
                const data = await http.get('/user/articles', { page: 1, size: 50 });
                pane.innerHTML = (data.records && data.records.length)
                    ? data.records.map(articleRow).join('')
                    : emptyState('暂未发布文章', '<a href="/write" class="btn btn-primary" style="margin-top:12px;">去写文章</a>');
                pane.dataset.loaded = 'true';
            } catch (e) {
                pane.innerHTML = emptyState('加载失败');
            }
        }

        async function loadRelationArticles(pane, url, emptyText) {
            try {
                const data = await http.get(url, { page: 1, size: 50 });
                pane.innerHTML = (data.records && data.records.length)
                    ? data.records.map(articleRow).join('')
                    : emptyState(emptyText);
                pane.dataset.loaded = 'true';
            } catch (e) {
                pane.innerHTML = emptyState('加载失败');
            }
        }

        async function loadMyComments(pane) {
            try {
                const data = await http.get('/user/comments', { page: 1, size: 50 });
                if (!data.records || data.records.length === 0) {
                    pane.innerHTML = emptyState('还没有发表过评论');
                    return;
                }
                pane.innerHTML = data.records.map(c => `
                    <div class="article-item">
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                        <div class="article-meta">
                            <span>${formatTime(c.createTime)}</span>
                            <span>${c.likeCount || 0} 点赞</span>
                            <a href="/article/${c.articleId}">《${escapeHtml(c.articleTitle || '文章')}》</a>
                        </div>
                    </div>`).join('');
                pane.dataset.loaded = 'true';
            } catch (e) {
                pane.innerHTML = emptyState('加载失败');
            }
        }

        // 更新个人信息
        async function updateProfile(e) {
            e.preventDefault();
            try {
                await http.put('/user/profile?' + new URLSearchParams({
                    nickname: document.getElementById('editNickname').value,
                    email: document.getElementById('editEmail').value,
                    bio: document.getElementById('editBio').value
                }).toString());
                Toast.show('个人信息已更新');
                loadProfile();
            } catch (err) {
                Toast.show(err.message, 'error');
            }
        }

        // 修改头像：本地图片上传
        async function updateAvatar() {
            const input = document.getElementById('avatarFile');
            const file = input.files[0];
            if (!file) { Toast.show('请选择图片文件', 'warning'); return; }
            if (!file.type.startsWith('image/')) { Toast.show('只能选择图片文件', 'warning'); return; }
            if (file.size > 2 * 1024 * 1024) { Toast.show('图片不能超过 2MB', 'warning'); return; }
            try {
                const url = await http.upload('/user/avatar', file);
                // 加时间戳防浏览器缓存旧图
                document.getElementById('profileAvatar').src = url + '?t=' + Date.now();
                closeAvatarModal();
                Toast.show('头像已更新');
                // 更新localStorage中的用户信息
                const user = Auth.getUser();
                if (user) { user.avatar = url; Auth.saveAuth(localStorage.getItem('token'), user); renderNavbar(); }
            } catch (err) {
                Toast.show(err.message, 'error');
            }
        }

        // 修改密码
        async function changePassword(e) {
            e.preventDefault();
            try {
                await http.put('/user/password?' + new URLSearchParams({
                    oldPassword: document.getElementById('oldPassword').value,
                    newPassword: document.getElementById('newPassword').value
                }).toString());
                Toast.show('密码修改成功，请重新登录');
                setTimeout(() => Auth.logout(), 1500);
            } catch (err) {
                Toast.show(err.message, 'error');
            }
        }

        function showAvatarModal() {
            document.getElementById('avatarModal').classList.add('show');
            // 每次打开重置选择状态
            document.getElementById('avatarFile').value = '';
            document.getElementById('avatarPreview').style.display = 'none';
        }

        // 选择文件后本地预览
        document.getElementById('avatarFile').addEventListener('change', function() {
            const file = this.files[0];
            const preview = document.getElementById('avatarPreview');
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'inline-block';
            } else {
                preview.style.display = 'none';
            }
        });
        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.remove('show');
        }

        loadProfile();
    </script>
</body>
</html>
