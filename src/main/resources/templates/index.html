<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">修仙心得</title>
    <!-- 浏览器标签页图标：用首页 banner 图（原无 favicon，浏览器会显示默认地球图标） -->
    <link rel="icon" type="image/jpeg" href="/images/home-songyu.jpg">
    <!-- 首屏封面图预加载：与 .home-cover 背景图共用同一 URL，只下载一次，后续 30 天走浏览器本地缓存 -->
    <link rel="preload" as="image" href="/images/home-songyu.jpg"
          th:if="${bannerUrl != null}" th:href="${bannerUrl}">
    <link rel="stylesheet" href="/css/style.css?v=15">
    <style>
        /* 首页专属：顶部「洞中灵气」实时条（样式其余额外加 .home 作用域，避免影响其他页面） */
        .home .hero-live {
            display: inline-flex; align-items: center; gap: 12px; margin-top: 18px;
            padding: 9px 16px; border-radius: 999px; font-size: 13px; text-decoration: none;
            color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
            backdrop-filter: blur(8px); transition: all .2s;
        }
        .home .hero-live:hover { background: rgba(255,255,255,.26); transform: translateY(-1px); }
        .home .hero-live-label { opacity: .78; letter-spacing: .04em; }
        .home .hero-live b { font-variant-numeric: tabular-nums; }
        .home .hero-live-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0;
            box-shadow: 0 0 0 4px rgba(74,222,128,.25); animation: heroLivePulse 1.8s infinite;
        }
        @keyframes heroLivePulse { 50% { box-shadow: 0 0 0 8px rgba(74,222,128,0); } }
        .home .hero-live.warning .hero-live-dot { background: #fbbf24; }
        .home .hero-live.danger .hero-live-dot { background: #f87171; box-shadow: 0 0 0 4px rgba(248,113,113,.32); }
        .home .hero-live-cta { padding-left: 12px; border-left: 1px solid rgba(255,255,255,.28); font-weight: 600; }
    </style>
</head>
<body class="home">
    <!-- 顶部封面：导航与 Banner 共用同一张背景图，作为一个整体随页面滚动（图片由 home.banner-image 配置） -->
    <div class="home-cover" th:style="${bannerStyle}">
        <header class="home-hero">
            <div class="home-hero-inner">
                <div class="home-hero-copy">
                    <div class="hero-eyebrow">Ordinary People's Ascension to Immortality</div>
                    <h1 class="hero-title">凡人修仙论坛</h1>
                    <p class="hero-sub">记录平凡故事 · 分享修真心得</p>
                    <!-- 洞中灵气：把公开的后端监控接口当成首页氛围条用，
                         顺便给「JVM 渡劫看板」一个不占导航位的入口（接口 @NoAuth，游客可看） -->
                    <a class="hero-live" href="/monitor" id="heroLive" hidden>
                        <span class="hero-live-dot"></span>
                        <span class="hero-live-label">洞中灵气</span>
                        <span>堆 <b id="liveHeap">--</b></span>
                        <span>堆外 <b id="liveDirect">--</b></span>
                        <span>境界 <b id="liveRealm">--</b></span>
                        <span class="hero-live-cta">渡劫看板 →</span>
                    </a>
                </div>
                <div class="hero-actions">
                    <button type="button" class="hero-btn" onclick="AiAssistant.toggle()">🤖 问 银月</button>
                    <!-- 导航链接（首页 / 写文章 / 通知 / 用户菜单）与上面按钮同排；
                         原「开始阅读」按钮已去掉：论坛是持续流动的帖子流，不是一篇要「读完」的书，
                         文章列表本身就在首屏可见，锚点跳转反而多一次无意义点击 -->
                    <div class="nav-links hero-nav" id="navLinks"></div>
                </div>
            </div>
        </header>
    </div>

    <!-- 三栏主内容区：左·信息 / 中·文章 / 右·工具 -->
    <div class="container home-layout">
        <!-- ==================== 左侧栏 ==================== -->
        <aside class="col-left">
            <!-- 博主名片 -->
            <div class="card profile-card">
                <div class="profile-cover"></div>
                <div class="profile-main">
                    <img class="profile-avatar"
                         th:src="${author != null ? author.avatar : '/images/default-avatar.svg'}"
                         src="/images/default-avatar.svg" alt="博主头像"
                         onerror="this.onerror=null;this.src='/images/default-avatar.svg'">
                    <div class="profile-name"
                         th:text="${author != null ? author.name : '博主'}">博主</div>
                    <div class="profile-desc"
                         th:text="${author != null ? author.bio : '记录平凡故事 · 分享修真心得'}">记录平凡故事 · 分享修真心得</div>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <b id="statArticles">—</b>
                            <span>文章</span>
                        </div>
                        <div class="profile-stat">
                            <b id="statCategories">—</b>
                            <span>分类</span>
                        </div>
                        <div class="profile-stat">
                            <b id="statTags">—</b>
                            <span>标签</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分类导航 -->
            <div class="card side-card">
                <div class="side-card-title">📂 文章分类</div>
                <nav class="nav-list" id="categoryList">
                    <a href="#" class="nav-item active" data-category=""
                       onclick="filterByCategory('');return false;">
                        <span class="nav-icon">🗂️</span>
                        <span class="nav-text">全部文章</span>
                        <span class="nav-count" id="countAll">0</span>
                    </a>
                </nav>
            </div>

            <!-- 快捷入口 -->
            <div class="card side-card">
                <div class="side-card-title">⚡ 快捷入口</div>
                <div class="quick-links">
                    <a href="/write" class="quick-link"><span class="quick-icon">✍️</span>写文章</a>
                    <a href="/monitor" class="quick-link"><span class="quick-icon">⚡</span>渡劫看板</a>
                    <a href="/profile" class="quick-link"><span class="quick-icon">👤</span>个人中心</a>
                    <a href="#" class="quick-link" onclick="AiAssistant.toggle();return false;">
                        <span class="quick-icon">🤖</span>问问 AI 助手
                    </a>
                </div>
            </div>
        </aside>

        <!-- ==================== 中间：核心文章区 ==================== -->
        <main class="main-content">
            <!-- 文章列表 -->
            <div class="card list-card">
                <div class="list-head">
                    <h2 class="list-title">最新文章</h2>
                    <div class="list-tools">
                        <span class="filter-chip" id="activeFilter" hidden>
                            <span id="activeFilterText"></span>
                            <button type="button" onclick="clearFilters()" title="清除筛选"
                                    aria-label="清除筛选">✕</button>
                        </span>
                        <span class="list-meta" id="listMeta">加载中…</span>
                        <!-- 时间排序：默认最新在前，点一下切到最早在前 -->
                        <button type="button" class="sort-btn" id="sortBtn" onclick="toggleSort()"
                                title="切换时间排序" aria-pressed="false">
                            <span class="sort-arrow" id="sortArrow">↓</span><span id="sortLabel">最新</span>
                        </button>
                    </div>
                </div>
                <div id="articleList"></div>
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </main>

        <!-- ==================== 右侧栏 ==================== -->
        <aside class="col-right">
            <!-- 搜索 -->
            <div class="card side-card">
                <div class="side-card-title">🔍 搜索文章</div>
                <div class="side-search">
                    <input type="text" id="searchInput" placeholder="标题或摘要关键词"
                           aria-label="搜索文章"
                           onkeyup="if(event.key==='Enter') searchArticles()">
                    <button type="button" onclick="searchArticles()" title="搜索" aria-label="搜索">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-3.5-3.5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- AI 助手入口：本项目差异点，放到右栏第二位置 -->
            <div class="card side-card ai-cta">
                <div class="ai-cta-title">🤖 银月 · AI 助手</div>
                <div class="ai-cta-desc">找文章 · 看排行 · 总结内容 · 随时答疑</div>
                <button type="button" class="ai-cta-btn" onclick="AiAssistant.toggle()">立即对话 →</button>
            </div>

            <!-- 热门文章 -->
            <div class="card side-card">
                <div class="side-card-title">🔥 热门文章</div>
                <ul class="hot-list" id="hotList">
                    <li class="loading">加载中...</li>
                </ul>
            </div>

            <!-- 标签云 -->
            <div class="card side-card">
                <div class="side-card-title">🏷️ 标签云</div>
                <div class="tag-cloud" id="tagCloud">
                    <span class="tag-cloud-empty">加载中…</span>
                </div>
            </div>
        </aside>
    </div>

    <script src="/js/app.js?v=9"></script>
    <script>
        // ==================== 首页逻辑 ====================
        let currentPage = 1;
        let currentCategory = '';
        let currentKeyword = '';
        // 时间排序：latest = 最新在前（默认），earliest = 最早在前
        let currentSort = 'latest';

        // 分类图标（未命中时用默认图标）：技术分类 + 修仙功法分类并存
        const CATEGORY_ICONS = {
            'Spring': '🍃', '数据库': '🗄️', '架构': '🏗️', '前端': '🎨',
            '功法': '📜', '法宝': '⚔️', '丹药': '💊', '灵植': '🌿',
            '宗门': '🏯', '见闻': '🗺️', '双修': '☯️', '神通': '✨'
        };

        // 标签展示规则：过长的标签多为摘要被误填（脏数据），统一在展示层过滤
        const MAX_TAG_LENGTH = 8;
        const MAX_TAG_COUNT = 20;

        // ==================== 文章列表 ====================
        async function loadArticles(page = 1) {
            currentPage = page;
            const params = { page, size: 10, sort: currentSort };
            if (currentCategory) params.category = currentCategory;
            if (currentKeyword) params.keyword = currentKeyword;

            try {
                const data = await http.get('/articles', params);
                const list = document.getElementById('articleList');
                const meta = document.getElementById('listMeta');
                const total = data.total || 0;
                const filtering = !!(currentCategory || currentKeyword);

                meta.textContent = filtering ? `筛选出 ${total} 篇` : `共 ${total} 篇`;
                renderActiveFilter();

                if (!data.records || data.records.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <h3>没有匹配的文章</h3>
                            <p>换个关键词，或清除当前筛选条件</p>
                            ${filtering ? '<button class="btn btn-outline btn-sm" onclick="clearFilters()">清除筛选</button>' : ''}
                        </div>`;
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                list.innerHTML = data.records.map(article => `
                    <article class="article-item">
                        <h3 class="article-title">
                            ${article.isTop ? '<span class="top-badge">置顶</span>' : ''}
                            <a href="/article/${article.id}">${escapeHtml(article.title)}</a>
                        </h3>
                        <div class="article-meta">
                            ${article.authorId ? `<a href="/user/${article.authorId}" class="article-author">
                                <img src="${escapeAttr(article.authorAvatar || '/images/default-avatar.svg')}" alt=""
                                     onerror="this.onerror=null;this.src='/images/default-avatar.svg'">
                                ${escapeHtml(article.authorName || '匿名')}</a>` : ''}
                            <span>${formatTime(article.createTime)}</span>
                            <span>${article.viewCount || 0} 阅读</span>
                            <span>${article.commentCount || 0} 评论</span>
                            <span>${article.likeCount || 0} 点赞</span>
                            <span>${article.favoriteCount || 0} 收藏</span>
                        </div>
                        <p class="article-summary">${escapeHtml(article.summary || '')}</p>
                        <div class="article-tags">
                            ${article.category ? `<span class="category-tag">${escapeHtml(article.category)}</span>` : ''}
                            ${(article.tags || '').split(',').map(t => t.trim())
                                .filter(t => t && t.length <= MAX_TAG_LENGTH)
                                .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                        </div>
                    </article>
                `).join('');

                renderPagination(data);
            } catch (e) {
                document.getElementById('listMeta').textContent = '';
                document.getElementById('articleList').innerHTML =
                    '<div class="empty-state"><h3>加载失败</h3><p>' + e.message + '</p></div>';
            }
        }

        // 分页：首尾 + 当前页附近，中间省略，避免页码溢出
        function renderPagination(data) {
            const pag = document.getElementById('pagination');
            const pages = data.pages || 0;
            if (pages <= 1) { pag.innerHTML = ''; return; }

            const cur = currentPage;
            const nums = [];
            [1, cur - 1, cur, cur + 1, pages].forEach(n => {
                if (n >= 1 && n <= pages && !nums.includes(n)) nums.push(n);
            });
            nums.sort((a, b) => a - b);

            let items = '';
            let prev = 0;
            nums.forEach(n => {
                if (prev && n - prev > 1) items += '<span class="page-ellipsis">…</span>';
                items += `<button class="page-btn ${n === cur ? 'active' : ''}"
                                  onclick="loadArticles(${n})">${n}</button>`;
                prev = n;
            });

            pag.innerHTML = `
                <button class="page-btn page-nav" onclick="loadArticles(${cur - 1})" ${cur === 1 ? 'disabled' : ''}>上一页</button>
                ${items}
                <button class="page-btn page-nav" onclick="loadArticles(${cur + 1})" ${cur === pages ? 'disabled' : ''}>下一页</button>
            `;
        }

        function searchArticles() {
            currentKeyword = document.getElementById('searchInput').value.trim();
            loadArticles(1);
        }

        // 时间排序：默认最新在前，再点切到最早在前（置顶文章始终在最前）
        function toggleSort() {
            currentSort = currentSort === 'latest' ? 'earliest' : 'latest';
            renderSortButton();
            loadArticles(1);
        }

        function renderSortButton() {
            const latest = currentSort === 'latest';
            document.getElementById('sortLabel').textContent = latest ? '最新' : '最早';
            document.getElementById('sortArrow').textContent = latest ? '↓' : '↑';
            document.getElementById('sortBtn').setAttribute('aria-pressed', String(!latest));
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryList .nav-item').forEach(el => {
                el.classList.toggle('active', (el.dataset.category || '') === cat);
            });
            loadArticles(1);
        }

        // 当前筛选条件以 chip 形式回显，用户随时可一键清除
        function renderActiveFilter() {
            const chip = document.getElementById('activeFilter');
            const text = document.getElementById('activeFilterText');
            const parts = [];
            if (currentCategory) parts.push('分类：' + currentCategory);
            if (currentKeyword) parts.push('关键词：' + currentKeyword);
            if (parts.length === 0) {
                chip.hidden = true;
                return;
            }
            text.textContent = parts.join(' · ');
            chip.hidden = false;
        }

        function clearFilters() {
            currentCategory = '';
            currentKeyword = '';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('#categoryList .nav-item').forEach(el => {
                el.classList.toggle('active', (el.dataset.category || '') === '');
            });
            loadArticles(1);
        }

        // 首屏骨架屏：避免白屏与布局跳动
        function renderSkeleton(count = 3) {
            document.getElementById('articleList').innerHTML = Array.from({ length: count }, () => `
                <div class="sk-item">
                    <div class="skeleton sk-title"></div>
                    <div class="skeleton sk-meta"></div>
                    <div class="skeleton sk-line"></div>
                    <div class="skeleton sk-line sk-w70"></div>
                </div>`).join('');
        }

        // ==================== 右侧栏：热门文章 ====================
        async function loadHotArticles() {
            try {
                const articles = await http.get('/articles/hot', { limit: 5 });
                const list = document.getElementById('hotList');
                if (!articles || articles.length === 0) {
                    list.innerHTML = '<li class="hot-empty">暂无热门文章</li>';
                    return;
                }
                list.innerHTML = articles.map((a, i) => `
                    <li>
                        <span class="hot-rank ${i < 3 ? 'top' : ''}">${i + 1}</span>
                        <a href="/article/${a.id}">${escapeHtml(a.title)}</a>
                    </li>
                `).join('');
            } catch (e) {
                document.getElementById('hotList').innerHTML = '<li class="hot-empty">暂无热门文章</li>';
            }
        }

        // ==================== 左侧栏 / 右侧栏：分类与标签统计 ====================
        async function loadSiteStats() {
            try {
                // 一次拉取较多文章，用于本地聚合分类与标签（后端带 5 分钟缓存）
                const data = await http.get('/articles', { page: 1, size: 100 });
                const records = data.records || [];
                const catMap = new Map();
                const tagMap = new Map();

                records.forEach(a => {
                    if (a.category) catMap.set(a.category, (catMap.get(a.category) || 0) + 1);
                    (a.tags || '').split(',').forEach(t => {
                        const tag = t.trim();
                        if (tag) tagMap.set(tag, (tagMap.get(tag) || 0) + 1);
                    });
                });

                const total = data.total || records.length;
                document.getElementById('statArticles').textContent = total;
                document.getElementById('countAll').textContent = total;
                document.getElementById('statCategories').textContent = catMap.size;
                document.getElementById('statTags').textContent = tagMap.size;

                renderCategories(catMap);
                renderTags(tagMap);
            } catch (e) {
                document.getElementById('statArticles').textContent = '—';
                document.getElementById('statCategories').textContent = '—';
                document.getElementById('statTags').textContent = '—';
                document.getElementById('countAll').textContent = '—';
            }
        }

        function renderCategories(catMap) {
            const nav = document.getElementById('categoryList');
            const sorted = Array.from(catMap.entries()).sort((a, b) => b[1] - a[1]);
            nav.insertAdjacentHTML('beforeend', sorted.map(([name, count]) => `
                <a href="#" class="nav-item" data-category="${escapeHtml(name)}"
                   onclick="filterByCategory(this.dataset.category);return false;">
                    <span class="nav-icon">${CATEGORY_ICONS[name] || '📁'}</span>
                    <span class="nav-text">${escapeHtml(name)}</span>
                    <span class="nav-count">${count}</span>
                </a>
            `).join(''));
        }

        // 标签云：按热度降序 + 字号分级
        function renderTags(tagMap) {
            const box = document.getElementById('tagCloud');
            const sorted = Array.from(tagMap.entries())
                .filter(([name]) => name.length <= MAX_TAG_LENGTH)
                .sort((a, b) => b[1] - a[1])
                .slice(0, MAX_TAG_COUNT);

            if (sorted.length === 0) {
                box.innerHTML = '<span class="tag-cloud-empty">暂无标签</span>';
                return;
            }
            box.innerHTML = sorted.map(([name, count]) => `
                <a href="#" class="tag-pill ${count >= 3 ? 'sz3 hot' : count === 2 ? 'sz2 hot' : ''}"
                   title="按标签搜索" data-tag="${escapeHtml(name)}"
                   onclick="searchByTag(this.dataset.tag);return false;">${escapeHtml(name)}</a>
            `).join('');
        }

        function searchByTag(tag) {
            document.getElementById('searchInput').value = tag;
            searchArticles();
        }

        // escapeHtml / formatTime 由 app.js 统一提供，页面内不再重复定义

        // ==================== 洞中灵气（首页实时条） ====================
        /* 与看板页用同一套境界划分、同一个接口：首页只取个概览，
           10 秒一次足够 —— 首页是入口不是监控大屏，刷得太勤反而给服务器添活。
           写法记一笔：境界表必须用对象数组，不能写成「中括号套中括号」的数组 ——
           Thymeleaf 会对 script 做 JS 内联，双层中括号会被当内联表达式解析，整页直接 500。 */
        const HERO_REALMS = [
            { under: 20, name: '炼气' }, { under: 40, name: '筑基' }, { under: 60, name: '金丹' },
            { under: 80, name: '元婴' }, { under: 95, name: '化神' }, { under: 101, name: '渡劫' }
        ];

        async function loadHeroLive() {
            try {
                const m = await http.get('/monitor/memory');
                const pct = Math.min(100, Math.round(m.heapUsedMb / m.heapMaxMb * 100));
                const dpct = m.directMaxMb > 0 ? Math.min(100, Math.round(m.directUsedMb / m.directMaxMb * 100)) : 0;
                const realm = (HERO_REALMS.find(r => pct < r.under) || HERO_REALMS[HERO_REALMS.length - 1]).name;
                document.getElementById('liveHeap').textContent = pct + '%';
                document.getElementById('liveDirect').textContent = dpct + '%';
                document.getElementById('liveRealm').textContent = realm + '期';
                const bar = document.getElementById('heroLive');
                bar.hidden = false;
                bar.classList.toggle('danger', pct >= 80 || dpct >= 80);
                bar.classList.toggle('warning', !bar.classList.contains('danger') && m.faultEnabled);
            } catch (e) {
                // 拉不到就整条隐藏：首页不该出现一排 --
                document.getElementById('heroLive').hidden = true;
            }
        }

        // 初始化：先铺骨架屏，再并行拉取数据
        renderSkeleton();
        loadArticles();
        loadHotArticles();
        loadSiteStats();
        loadHeroLive();
        setInterval(loadHeroLive, 10000);

        // AI 助手对话框（右下角悬浮按钮）
        AiAssistant.init();
    </script>
</body>
</html>
