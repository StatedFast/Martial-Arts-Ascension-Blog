<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 修仙心得</title>
    <link rel="stylesheet" href="/css/style.css?v=14">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">📝 修仙心得</a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="card auth-card">
            <h2 class="auth-title">创建账号 ✨</h2>
            <p class="auth-subtitle">加入修仙心得社区</p>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="3-20个字符" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-control" id="nickname" placeholder="您的昵称" required>
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-control" id="email" placeholder="选填">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="6-20个字符" required minlength="6" maxlength="20">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注册</button>
            </form>
            <div class="auth-footer">
                已有账号？<a href="/login">立即登录</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=7"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            btn.textContent = '注册中...';
            btn.disabled = true;

            try {
                const data = await http.post('/user/register', {
                    username: document.getElementById('username').value,
                    nickname: document.getElementById('nickname').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                Auth.saveAuth(data.accessToken, data.user);
                Toast.show('注册成功！');
                setTimeout(() => window.location.href = '/', 500);
            } catch (err) {
                Toast.show(err.message, 'error');
                btn.textContent = '注册';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
