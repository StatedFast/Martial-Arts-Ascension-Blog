<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">配置中心 - 修仙心得</title>
    <link rel="icon" type="image/jpeg" href="/images/home-songyu.jpg">
    <link rel="stylesheet" href="/css/style.css?v=15">
    <style>
        .cfg-mem-card { padding: 20px; }
        .cfg-mem-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        #memChart { width: 100%; height: 140px; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 8px; margin: 4px 0 10px; }
        .cfg-legend { font-weight: 600; }
        .cfg-legend-heap { color: #f44336; }
        .cfg-legend-direct { color: #2196f3; }
        .cfg-mem-info { display: flex; gap: 24px; font-size: 13px; color: #666; flex-wrap: wrap; }
        .cfg-badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .cfg-on { background: #ffebee; color: #c62828; }
        .cfg-off { background: #e8f5e9; color: #2e7d32; }
        table.cfg-table { width: 100%; border-collapse: collapse; }
        table.cfg-table th, table.cfg-table td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
        table.cfg-table td.cfg-desc { color: #888; font-size: 13px; }
        table.cfg-table input.cfg-val { width: 120px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; }
        .cfg-actions { display: flex; gap: 24px; flex-wrap: wrap; padding: 16px; align-items: center; }
        .cfg-ctl { display: flex; align-items: center; gap: 8px; }
        .cfg-ctl-label { font-size: 14px; color: #333; font-weight: 600; }
        .cfg-ctl-state { font-size: 12px; color: #999; min-width: 42px; }
        /* 微信式滑块开关：点一下滑右变色=开，再点滑左=关 */
        .cfg-switch { width: 46px; height: 26px; border-radius: 13px; background: #ddd; position: relative; cursor: pointer; transition: background .25s; flex-shrink: 0; }
        .cfg-switch-knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .25s; }
        .cfg-switch.on { background: #07c160; }
        .cfg-switch.on .cfg-switch-knob { left: 23px; }
        .cfg-switch-blue.on { background: #1976d2; }
        /* 分段选择器：选中项填充与趋势曲线同色，颜色语义对齐 */
        .cfg-seg { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .cfg-seg button { border: none; background: #fff; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #666; transition: background .2s, color .2s; }
        .cfg-seg button.active-heap { background: #f44336; color: #fff; }
        .cfg-seg button.active-direct { background: #2196f3; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">📝 修仙心得</a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="container">
        <div class="main-content">
            <!-- 实时内存 -->
            <div class="card cfg-mem-card" style="margin-bottom:16px;">
                <div class="cfg-mem-title">
                    JVM 实时内存
                    <span id="faultBadge" class="cfg-badge cfg-off">演练关闭</span>
                </div>
                <canvas id="memChart"></canvas>
                <div class="cfg-mem-info">
                    <span class="cfg-legend cfg-legend-heap">— 堆内存：<b id="heapText">--</b></span>
                    <span class="cfg-legend cfg-legend-direct">— 堆外(direct)：<b id="directText">--</b></span>
                    <span>非堆(元空间等)：<b id="nonHeapText">--</b></span>
                    <span>故障类型：<b id="faultTypeText">--</b></span>
                    <span>刷新间隔：<b id="intervalText">--</b></span>
                    <span id="boundedText" style="display:none;">有界缓存：<b>--</b></span>
                </div>
            </div>

            <!-- 演练控制台：开关/分段器状态由后端每轮下发渲染，前端只做乐观翻转 -->
            <div class="card" style="margin-bottom:16px;">
                <div class="cfg-actions">
                    <div class="cfg-ctl">
                        <span class="cfg-ctl-label">故障演练</span>
                        <div class="cfg-switch" id="swFault" onclick="toggleSwitch('swFault','fault.oom.enabled','演练已开启，注意观察曲线','演练已关闭（止血）')"><div class="cfg-switch-knob"></div></div>
                        <span class="cfg-ctl-state" id="swFaultText">--</span>
                    </div>
                    <div class="cfg-ctl">
                        <span class="cfg-ctl-label">泄漏类型</span>
                        <div class="cfg-seg">
                            <button id="segHeap" onclick="setType('heap')">堆内 heap</button>
                            <button id="segDirect" onclick="setType('direct')">堆外 direct</button>
                        </div>
                    </div>
                    <div class="cfg-ctl">
                        <span class="cfg-ctl-label">修复模式</span>
                        <div class="cfg-switch cfg-switch-blue" id="swFixed" onclick="toggleSwitch('swFixed','fault.oom.fixed','修复已开启（停止新增，存量不降）','修复已关闭（恢复泄漏注入）')"><div class="cfg-switch-knob"></div></div>
                        <span class="cfg-ctl-state" id="swFixedText">--</span>
                    </div>
                    <button class="btn btn-outline btn-sm" onclick="recover()">↺ 回收泄漏内存（堆内+堆外）</button>
                </div>
            </div>

            <!-- 配置表格 -->
            <div class="card">
                <div style="padding:16px 20px;font-weight:600;border-bottom:1px solid #f0f0f0;">配置项（k-v）</div>
                <div id="configList"><div class="loading">加载中...</div></div>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=7"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login';
        }
        const me = Auth.getUser();
        if (!isAdmin(me)) {
            document.querySelector('.main-content').innerHTML =
                '<div class="empty-state"><h3>无权限</h3><p>配置中心仅管理员可访问</p></div>';
        }

        // ======== 配置列表 ========
        async function loadConfigs() {
            try {
                const list = await http.get('/admin/config');
                renderConfigs(list);
            } catch (e) {
                document.getElementById('configList').innerHTML =
                    '<div class="empty-state"><h3>加载失败</h3><p>' + escapeHtml(e.message) + '</p></div>';
            }
        }

        function renderConfigs(list) {
            if (!list || !list.length) {
                document.getElementById('configList').innerHTML = '<div class="empty-state"><h3>暂无配置项</h3></div>';
                return;
            }
            const rows = list.map(c => `
                <tr>
                    <td><code>${escapeHtml(c.configKey)}</code></td>
                    <td class="cfg-desc">${escapeHtml(c.description || '')}</td>
                    <td><input class="cfg-val" id="val_${c.id}" value="${escapeAttr(c.configValue || '')}"></td>
                    <td><button class="btn btn-primary btn-sm" onclick="saveOne(${c.id}, '${escapeAttr(c.configKey)}')">保存</button></td>
                </tr>`).join('');
            document.getElementById('configList').innerHTML = `
                <table class="cfg-table">
                    <thead><tr><th>键</th><th>说明</th><th>值</th><th></th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        async function saveOne(id, key) {
            const input = document.getElementById('val_' + id);
            try {
                await http.put('/admin/config', { configKey: key, configValue: input.value });
                Toast.show('已保存：' + key);
                loadConfigs();
            } catch (e) {
                Toast.show(e.message, 'error');
            }
        }

        // ======== 控件状态渲染：后端是唯一事实源，每轮轮询重刷（多标签页也能看到真实状态） ========
        function renderControls(m) {
            const swF = document.getElementById('swFault');
            swF.classList.toggle('on', !!m.faultEnabled);
            document.getElementById('swFaultText').textContent = m.faultEnabled ? '进行中' : '已关闭';
            const swX = document.getElementById('swFixed');
            swX.classList.toggle('on', !!m.faultFixed);
            document.getElementById('swFixedText').textContent = m.faultFixed ? '防新增' : '已关闭';
            document.getElementById('segHeap').className = m.faultType === 'heap' ? 'active-heap' : '';
            document.getElementById('segDirect').className = m.faultType === 'direct' ? 'active-direct' : '';
        }

        // 防抖：一个写请求在飞时忽略其他点击，失败下轮轮询会用后端真值把 UI 纠正回来
        let ctlBusy = false;

        function toggleSwitch(id, key, onMsg, offMsg) {
            if (ctlBusy) return;
            // 乐观更新：先本地翻转开关动画，再提交；后端是最终裁判
            document.getElementById(id).classList.toggle('on');
            const on = document.getElementById(id).classList.contains('on');
            setFault(key, on ? 'true' : 'false', on ? onMsg : offMsg);
        }

        async function setFault(key, value, okMsg) {
            if (ctlBusy) return;
            ctlBusy = true;
            try {
                await http.put('/admin/config', { configKey: key, configValue: value });
                if (okMsg) Toast.show(okMsg);
                loadConfigs();
                pollMemory();
            } catch (e) {
                Toast.show(e.message, 'error');
            } finally {
                ctlBusy = false;
            }
        }

        async function setType(type) {
            if (ctlBusy) return;
            ctlBusy = true;
            try {
                await http.put('/admin/config', { configKey: 'fault.oom.type', configValue: type });
                Toast.show('故障类型已切换为：' + (type === 'heap' ? '堆内泄漏' : '堆外泄漏'));
                loadConfigs();
                pollMemory();
            } catch (e) {
                Toast.show(e.message, 'error');
            } finally {
                ctlBusy = false;
            }
        }

        // 回收已泄漏内存（修复模式只能「不再新增」，已泄漏的需显式摘引用 + GC 才降得下来）
        async function recover() {
            try {
                const msg = await http.post('/admin/config/recover');
                Toast.show(typeof msg === 'string' ? msg : '已触发回收');
                setTimeout(pollMemory, 800);
            } catch (e) { Toast.show(e.message, 'error'); }
        }

        // ======== 内存趋势曲线：本地保留最近 120 个采样点（2s 轮询 ≈ 4 分钟窗口），原生 canvas 双线 ========
        const HIST_CAP = 120;
        const heapHist = [], directHist = [];

        function pushHist(arr, v) {
            arr.push(v);
            if (arr.length > HIST_CAP) arr.shift();
        }

        function drawSmoothLine(ctx, arr, w, h, color) {
            if (arr.length < 2) return;
            const pts = arr.map((v, i) => ({
                x: i / (HIST_CAP - 1) * w,
                y: h - (v / 100) * (h - 8) - 4
            }));
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            // 中点二次贝塞尔：以上一点为控制点、与下一点的中点为终点，曲线平滑穿过采样趋势
            for (let i = 1; i < pts.length - 1; i++) {
                const mx = (pts[i].x + pts[i + 1].x) / 2;
                const my = (pts[i].y + pts[i + 1].y) / 2;
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
            }
            ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
            ctx.stroke();
        }

        function drawChart() {
            const canvas = document.getElementById('memChart');
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (canvas.width !== w) canvas.width = w;
            if (canvas.height !== h) canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            // 80% 告警参考线：越过它就该准备抓证据/止血了
            ctx.strokeStyle = '#e0e0e0';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            const y80 = h - 0.8 * (h - 8) - 4;
            ctx.moveTo(0, y80);
            ctx.lineTo(w, y80);
            ctx.stroke();
            ctx.setLineDash([]);
            drawSmoothLine(ctx, heapHist, w, h, '#f44336');
            drawSmoothLine(ctx, directHist, w, h, '#2196f3');
        }

        // ======== 刷新节奏：默认 3 秒，间隔存 blog_sys_config（monitor.poll-interval-seconds），
        // 每轮响应下发当前值，变更后自动重排定时器，改完即生效无需刷新页面 ========
        let pollMs = 3000;
        let pollTimer = null;

        function schedulePoll(ms) {
            if (ms === pollMs && pollTimer) return;
            pollMs = ms;
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollMemory, pollMs);
        }

        // ======== 内存轮询 ========
        async function pollMemory() {
            if (!isAdmin(me)) return;
            try {
                const m = await http.get('/admin/config/memory');
                renderControls(m);
                const pct = Math.min(100, Math.round(m.heapUsedMb / m.heapMaxMb * 100));
                const dpct = m.directMaxMb > 0 ? Math.min(100, Math.round(m.directUsedMb / m.directMaxMb * 100)) : 0;
                document.getElementById('heapText').textContent = m.heapUsedMb + ' / ' + m.heapMaxMb + ' MB (' + pct + '%)';
                document.getElementById('directText').textContent = m.directUsedMb + ' / ' + m.directMaxMb + ' MB (' + dpct + '%)';
                const sec = m.pollIntervalSeconds || 3;
                document.getElementById('intervalText').textContent = sec + ' 秒';
                schedulePoll(sec * 1000);
                pushHist(heapHist, pct);
                pushHist(directHist, dpct);
                drawChart();
                document.getElementById('nonHeapText').textContent = m.nonHeapUsedMb + ' MB';
                document.getElementById('faultTypeText').textContent = m.faultType;
                const boundedEl = document.getElementById('boundedText');
                if (m.faultFixed) {
                    boundedEl.style.display = '';
                    boundedEl.innerHTML = '有界缓存：<b>' + m.boundedCacheSize + ' 条 / 已淘汰 ' + m.boundedCacheEvicted + ' 次</b>';
                } else {
                    boundedEl.style.display = 'none';
                }
                const badge = document.getElementById('faultBadge');
                if (m.faultEnabled && m.faultFixed) { badge.textContent = '✓ 修复模式（内存应走平）'; badge.className = 'cfg-badge cfg-off'; }
                else if (m.faultEnabled) { badge.textContent = '⚠ 泄漏演练中'; badge.className = 'cfg-badge cfg-on'; }
                else { badge.textContent = '演练关闭'; badge.className = 'cfg-badge cfg-off'; }
            } catch (e) { /* 静默，401 会由 http 统一跳转 */ }
        }

        if (isAdmin(me)) {
            loadConfigs();
            pollMemory();
            pollTimer = setInterval(pollMemory, pollMs);
        }
    </script>
</body>
</html>
