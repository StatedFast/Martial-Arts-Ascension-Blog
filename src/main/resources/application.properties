# ==================== \u670D\u52A1\u5668\u914D\u7F6E ====================
server.port=8081
# \u6700\u5927\u5DE5\u4F5C\u7EBF\u7A0B\u6570
server.tomcat.threads.max=200
# \u6700\u5C0F\u7A7A\u95F2\u7EBF\u7A0B
server.tomcat.threads.min-spare=20
# \u6700\u5927\u8FDE\u63A5\u6570
server.tomcat.max-connections=10000
# \u7B49\u5F85\u961F\u5217\u957F\u5EA6
server.tomcat.accept-count=500
# \u8FDE\u63A5\u8D85\u65F6
server.tomcat.connection-timeout=5000

# ==================== Spring \u57FA\u7840\u914D\u7F6E ====================
spring.application.name=spring-blog

# \u6570\u636E\u5E93\u914D\u7F6E\uFF08MySQL 8.4 \u672C\u5730\u5F00\u53D1\uFF1B\u53EF\u901A\u8FC7\u73AF\u5883\u53D8\u91CF DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD \u8986\u76D6\uFF09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:blog}
spring.datasource.password=${DB_PASSWORD:Blog@2026}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# SQL\u521D\u59CB\u5316
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Thymeleaf\u914D\u7F6E
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==================== \u672C\u5730\u56FE\u7247\u4E0A\u4F20\u914D\u7F6E ====================
# \u4E0A\u4F20\u6587\u4EF6\u6839\u76EE\u5F55\uFF08\u76F8\u5BF9\u5E94\u7528\u5DE5\u4F5C\u76EE\u5F55\uFF0C\u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u6539\u4E3A\u72EC\u7ACB\u7EDD\u5BF9\u8DEF\u5F84\uFF09
file.upload-dir=uploads
# \u5934\u50CF\u56FE\u7247\u5927\u5C0F\u4E0A\u9650
file.avatar-max-size=2MB

# ==================== MyBatis-Plus\u914D\u7F6E ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# SQL\u65E5\u5FD7\uFF1A\u8D70SLF4J\u7EDF\u4E00\u8F93\u51FA\uFF08UTF-8\uFF0C\u907F\u514DIDEA\u63A7\u5236\u53F0\u4E2D\u6587\u4E71\u7801\uFF09
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== JWT\u914D\u7F6E\uFF08\u4F01\u4E1A\u7EA7\uFF09 ====================
# \u5BC6\u94A5\uFF1A\u751F\u4EA7\u73AF\u5883\u5FC5\u987B\u901A\u8FC7\u73AF\u5883\u53D8\u91CF\u6CE8\u5165\uFF0C\u7981\u6B62\u786C\u7F16\u7801\uFF01
# \u8BBE\u7F6E\u65B9\u5F0F: set JWT_SECRET=\u4F60\u7684\u968F\u673A\u5BC6\u94A5(\u81F3\u5C1132\u5B57\u7B26)
jwt.secret=${JWT_SECRET:SpringAiBlogSecretKey2024VeryLongAndSecureKeyForJWT-Enterprise}
# Access Token\u6709\u6548\u671F: 30\u5206\u949F
jwt.access-token-expiration=1800000
# Refresh Token\u6709\u6548\u671F: 7\u5929
jwt.refresh-token-expiration=604800000
# Token\u7B7E\u53D1\u8005\u6807\u8BC6
jwt.issuer=spring-blog
# Token\u53D7\u4F17\u6807\u8BC6
jwt.audience=blog-client
# \u65F6\u949F\u504F\u5DEE\u5BB9\u5FCD(\u79D2)
jwt.clock-skew-seconds=60

# ==================== \u5B89\u5168\u914D\u7F6E\uFF08\u4F01\u4E1A\u7EA7\uFF09 ====================
# \u540C\u4E00\u8D26\u53F7\u6700\u5927\u5931\u8D25\u6B21\u6570
security.login.max-attempts=5
# \u8D26\u53F7\u9501\u5B9A\u65F6\u95F4(\u5206\u949F)
security.login.lock-duration-minutes=30
# \u540C\u4E00IP\u6700\u5927\u5931\u8D25\u6B21\u6570
security.login.ip-max-attempts=20

# ==================== CORS\u914D\u7F6E ====================
# \u751F\u4EA7\u73AF\u5883\u7528\u73AF\u5883\u53D8\u91CF CORS_ORIGINS \u8986\u76D6\uFF0C\u591A\u4E2A\u7528\u9017\u53F7\u5206\u9694\uFF08\u5982 http://118.31.186.244:8081,https://your-domain.com\uFF09
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

