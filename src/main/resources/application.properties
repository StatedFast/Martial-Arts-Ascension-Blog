# ==================== 服务器配置 ====================
server.port=8080
# 最大工作线程数
server.tomcat.threads.max=200
# 最小空闲线程
server.tomcat.threads.min-spare=20
# 最大连接数
server.tomcat.max-connections=10000
# 等待队列长度
server.tomcat.accept-count=500
# 连接超时
server.tomcat.connection-timeout=5000

# ==================== Spring 基础配置 ====================
spring.application.name=spring-blog

# 数据库配置（H2开发环境）
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# H2控制台
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL初始化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Thymeleaf配置
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==================== MyBatis-Plus配置 ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# SQL日志：走SLF4J统一输出（UTF-8，避免IDEA控制台中文乱码）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== JWT配置（企业级） ====================
# 密钥：生产环境必须通过环境变量注入，禁止硬编码！
# 设置方式: set JWT_SECRET=你的随机密钥(至少32字符)
jwt.secret=${JWT_SECRET:SpringAiBlogSecretKey2024VeryLongAndSecureKeyForJWT-Enterprise}
# Access Token有效期: 30分钟
jwt.access-token-expiration=1800000
# Refresh Token有效期: 7天
jwt.refresh-token-expiration=604800000
# Token签发者标识
jwt.issuer=spring-blog
# Token受众标识
jwt.audience=blog-client
# 时钟偏差容忍(秒)
jwt.clock-skew-seconds=60

# ==================== 安全配置（企业级） ====================
# 同一账号最大失败次数
security.login.max-attempts=5
# 账号锁定时间(分钟)
security.login.lock-duration-minutes=30
# 同一IP最大失败次数
security.login.ip-max-attempts=20

# ==================== CORS配置 ====================
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# ==================== Redis配置 ====================
# 本地默认连接，可通过环境变量覆盖（如 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 无密码时留空；生产环境建议通过环境变量 REDIS_PASSWORD 注入
spring.data.redis.password=${REDIS_PASSWORD:}
# 默认库编号
spring.data.redis.database=0
# 连接超时
spring.data.redis.timeout=5000ms
# Lettuce 连接池
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms

# ==================== Spring AI 配置 ====================
# API Key 通过环境变量注入：set AI_API_KEY=你的密钥（禁止硬编码）
spring.ai.openai.api-key=${AI_API_KEY:not-set}
# 模型服务地址（默认 DeepSeek，可换成通义千问等 OpenAI 兼容服务）
spring.ai.openai.base-url=https://api.deepseek.com
# 聊天模型名称（DeepSeek 用 deepseek-chat，通义可改 qwen-plus）
spring.ai.openai.chat.options.model=deepseek-chat
# 采样温度：0 更稳定、1 更发散
spring.ai.openai.chat.options.temperature=0.7

# ==================== 日志配置 ====================
# 控制台日志编码：UTF-8（与IDEA运行控制台解码一致）
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.root=INFO
logging.level.spring.ai.example.spring_ai_demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{50} - %msg%n
