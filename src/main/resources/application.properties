# ==================== Spring AI \u914D\u7F6E ====================
# API Key \u901A\u8FC7\u73AF\u5883\u53D8\u91CF\u6CE8\u5165\uFF1Aset AI_API_KEY=\u4F60\u7684\u5BC6\u94A5\uFF08\u7981\u6B62\u786C\u7F16\u7801\uFF09
spring.ai.openai.api-key=${AI_API_KEY:not-set}
# \u6A21\u578B\u670D\u52A1\u5730\u5740\uFF08\u9ED8\u8BA4 DeepSeek\uFF0C\u53EF\u6362\u6210\u901A\u4E49\u5343\u95EE\u7B49 OpenAI \u517C\u5BB9\u670D\u52A1\uFF09
spring.ai.openai.base-url=https://api.deepseek.com
# \u804A\u5929\u6A21\u578B\u540D\u79F0\uFF08DeepSeek \u7528 deepseek-chat\uFF0C\u901A\u4E49\u53EF\u6539 qwen-plus\uFF09
spring.ai.openai.chat.options.model=deepseek-chat
# \u91C7\u6837\u6E29\u5EA6\uFF1A0 \u66F4\u7A33\u5B9A\u30011 \u66F4\u53D1\u6563
spring.ai.openai.chat.options.temperature=0.7

# ==================== AI \u6BCF\u65E5\u914D\u989D\uFF08\u6309\u573A\u666F\u5206\u5F00\u8BA1\u6570\uFF09 ====================
# \u666E\u901A\u7528\u6237\u6BCF\u5929\u6700\u591A\u95EE\u7B54\u6B21\u6570\uFF08\u7BA1\u7406\u5458\u4E0D\u53D7\u9650\uFF09\uFF1B\u8D85\u51FA\u8FD4\u56DE\u300C\u975E\u7BA1\u7406\u5458\u4E00\u5929\u6700\u591AN\u6B21\u95EE\u7B54\u300D
ai.daily-limit=10
# \u666E\u901A\u7528\u6237\u6BCF\u5929\u6700\u591A AI \u5199\u4F5C\u6B21\u6570\uFF08\u6DA6\u8272/\u7EED\u5199/\u5927\u7EB2/\u6807\u9898/\u6458\u8981/\u6807\u7B7E\uFF09\uFF1B\u4E0E\u95EE\u7B54\u989D\u5EA6\u4E92\u4E0D\u5360\u7528
ai.writing-daily-limit=30
# \u8BA1\u6570\u6309\u300C\u573A\u666F + \u7528\u6237 + \u65E5\u671F\u300D\u5206\u6876\uFF0CTTL \u5230\u6B21\u65E5\u96F6\u70B9\u81EA\u52A8\u5F52\u96F6\uFF0C\u91CD\u542F\u5E94\u7528\u4F1A\u6E05\u96F6

# ==================== \u9996\u9875\u9876\u90E8\u901A\u680F Banner ====================
# \u80CC\u666F\u56FE\u5730\u5740\uFF1A\u628A\u56FE\u7247\u653E\u5230 static/images \u4E0B\u540E\u586B /images/\u6587\u4EF6\u540D\uFF08\u5982 /images/home-all.png\uFF09
# \u7559\u7A7A\u5219\u4F7F\u7528\u9ED8\u8BA4\u6E10\u53D8\u5360\u4F4D\uFF0C\u4E0D\u4F1A\u4EA7\u751F 404 \u8BF7\u6C42
home.banner-image=/images/home-songyu.jpg
# \u8F6E\u64AD\u5019\u9009\u56FE\uFF08\u9017\u53F7\u5206\u9694\uFF09\uFF1A\u53EA\u6709\u914D\u7F6E\u4E2D\u5FC3\u628A home.banner-cycle.enabled \u6253\u5F00\u624D\u542F\u7528\uFF0C
# \u5173\u95ED\u65F6\u9996\u9875\u4ECD\u53EA\u7528\u4E0A\u9762\u90A3\u5F20\u5355\u56FE \u2014\u2014 \u6362\u56FE\u987A\u5E8F\u5373\u6B64\u5904\u4E66\u5199\u987A\u5E8F\uFF0C\u6587\u4EF6\u540D\u540C\u65F6\u51B3\u5B9A\u6D4F\u89C8\u5668\u7F13\u5B58
home.banner-images=/images/images/home-hanli.png,/images/home-songyu.jpg
# \u8F6E\u64AD\u95F4\u9694\u4E0D\u5728\u6B64\u914D\u7F6E\uFF0C\u5B58 blog_sys_config \u7684 home.banner-cycle-seconds\uFF08\u6539\u5B8C\u5373\u751F\u6548\uFF0C\u4E0D\u7528\u91CD\u542F\uFF09

# ==================== OOM \u6545\u969C\u6F14\u7EC3\uFF08\u914D\u7F6E\u4E2D\u5FC3\u5F00\u5173\u9A71\u52A8\uFF0C\u9ED8\u8BA4\u5168\u90E8\u5173\u95ED\uFF09 ====================
# \u4FEE\u590D\u6A21\u5F0F\u6F14\u793A\u7528\uFF1A\u6709\u754C LRU \u7F13\u5B58\u7684\u6700\u5927\u6761\u76EE\u6570\uFF08\u914D\u5408 1MB \u8D1F\u8F7D\uFF0C\u5806\u5360\u7528\u5929\u82B1\u677F\u2248\u672C\u503C MB\uFF09
fault.drill.bounded-cache-max-size=32
# \u5B9E\u9645\u6F14\u7EC3\u5F00\u5173\uFF08enabled/type/batch-size/fixed\uFF09\u5B58 blog_sys_config \u8868\uFF0C\u7531 /config \u9875\u9762\u8BFB\u5199\uFF0C\u4E0D\u5728\u6B64\u914D\u7F6E

# ==================== \u65E5\u5FD7\u914D\u7F6E ====================
# \u63A7\u5236\u53F0\u65E5\u5FD7\u7F16\u7801\uFF1AUTF-8\uFF08\u4E0EIDEA\u8FD0\u884C\u63A7\u5236\u53F0\u89E3\u7801\u4E00\u81F4\uFF09
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.root=INFO
# \u4E1A\u52A1\u5305\u65E5\u5FD7\u7EA7\u522B\uFF1A\u5F00\u53D1\u7528 DEBUG\uFF08\u542B SQL\uFF09\uFF0C\u751F\u4EA7\u5EFA\u8BAE\u7528\u73AF\u5883\u53D8\u91CF LOG_LEVEL_APP \u6539\u4E3A INFO
logging.level.spring.ai.example.spring_ai_demo=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{50} - %msg%n
# \u65E5\u5FD7\u6587\u4EF6\u6839\u76EE\u5F55\uFF08\u76F8\u5BF9\u5E94\u7528\u5DE5\u4F5C\u76EE\u5F55\uFF1B\u670D\u52A1\u5668\u90E8\u7F72\u5EFA\u8BAE\u6539\u6210\u7EDD\u5BF9\u8DEF\u5F84\uFF0C\u5982 /var/log/spring-blog\uFF09
log.home=logs
# \u5355\u4E2A\u65E5\u5FD7\u6587\u4EF6\u5927\u5C0F\u4E0A\u9650\uFF1A\u5199\u6EE1\u5373\u65B0\u5EFA\u4E0B\u4E00\u4E2A\u5E8F\u53F7\u6587\u4EF6\uFF08\u5F53\u5929\u5185 %i \u9012\u589E\uFF09
log.max-file-size=1MB
# \u65E5\u5FD7\u4FDD\u7559\u5929\u6570\u4E0E\u603B\u5BB9\u91CF\u4E0A\u9650
log.max-history=30
log.total-size-cap=2GB
