# ==================== Spring AI 配置 ====================
# API Key 通过环境变量注入：set AI_API_KEY=你的密钥（禁止硬编码）
spring.ai.openai.api-key=${AI_API_KEY:not-set}
# 模型服务地址（默认 DeepSeek，可换成通义千问等 OpenAI 兼容服务）
spring.ai.openai.base-url=https://api.deepseek.com
# 聊天模型名称（DeepSeek 用 deepseek-chat，通义可改 qwen-plus）
spring.ai.openai.chat.options.model=deepseek-chat
# 采样温度：0 更稳定、1 更发散
spring.ai.openai.chat.options.temperature=0.7

# ==================== AI 每日配额（按场景分开计数） ====================
# 普通用户每天最多问答次数（管理员不受限）；超出返回「非管理员一天最多N次问答」
ai.daily-limit=10
# 普通用户每天最多 AI 写作次数（润色/续写/大纲/标题/摘要/标签）；与问答额度互不占用
ai.writing-daily-limit=30
# 计数按「场景 + 用户 + 日期」分桶，TTL 到次日零点自动归零，重启应用会清零

# ==================== 首页顶部通栏 Banner ====================
# 背景图地址：把图片放到 static/images 下后填 /images/文件名（如 /images/home-all.png）
# 留空则使用默认渐变占位，不会产生 404 请求
home.banner-image=/images/home-songyu.jpg

# ==================== OOM 故障演练（配置中心开关驱动，默认全部关闭） ====================
# 修复模式演示用：有界 LRU 缓存的最大条目数（配合 1MB 负载，堆占用天花板≈本值 MB）
fault.drill.bounded-cache-max-size=32
# 实际演练开关（enabled/type/batch-size/fixed）存 blog_sys_config 表，由 /config 页面读写，不在此配置

# ==================== 日志配置 ====================
# 控制台日志编码：UTF-8（与IDEA运行控制台解码一致）
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.root=INFO
# 业务包日志级别：开发用 DEBUG（含 SQL），生产建议用环境变量 LOG_LEVEL_APP 改为 INFO
logging.level.spring.ai.example.spring_ai_demo=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{50} - %msg%n
# 日志文件根目录（相对应用工作目录；服务器部署建议改成绝对路径，如 /var/log/spring-blog）
log.home=logs
# 单个日志文件大小上限：写满即新建下一个序号文件（当天内 %i 递增）
log.max-file-size=1MB
# 日志保留天数与总容量上限
log.max-history=30
log.total-size-cap=2GB
