# ==================== 服务器配置 ====================
server.port=8081
# 最大工作线程数
server.tomcat.threads.max=200
# 最小空闲线程
server.tomcat.threads.min-spare=20
# 最大连接数
server.tomcat.max-connections=10000
# 等待队列长度
server.tomcat.accept-count=500
# 连接超时
server.tomcat.connection-timeout=5000

# ==================== Spring 基础配置 ====================
spring.application.name=spring-blog

# 数据库配置（MySQL 8.4 本地开发；可通过环境变量 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD 覆盖）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:blog}
spring.datasource.password=${DB_PASSWORD:Blog@2026}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# SQL初始化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Thymeleaf配置
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==================== 本地图片上传配置 ====================
# 上传文件根目录（相对应用工作目录，生产环境建议改为独立绝对路径）
file.upload-dir=uploads
# 头像图片大小上限
file.avatar-max-size=2MB

# ==================== MyBatis-Plus配置 ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# SQL日志：走SLF4J统一输出（UTF-8，避免IDEA控制台中文乱码）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== JWT配置（企业级） ====================
# 密钥：生产环境必须通过环境变量注入，禁止硬编码！
# 设置方式: set JWT_SECRET=你的随机密钥(至少32字符)
jwt.secret=${JWT_SECRET:SpringAiBlogSecretKey2024VeryLongAndSecureKeyForJWT-Enterprise}
# Access Token有效期: 30分钟
jwt.access-token-expiration=1800000
# Refresh Token有效期: 7天
jwt.refresh-token-expiration=604800000
# Token签发者标识
jwt.issuer=spring-blog
# Token受众标识
jwt.audience=blog-client
# 时钟偏差容忍(秒)
jwt.clock-skew-seconds=60

# ==================== 安全配置（企业级） ====================
# 同一账号最大失败次数
security.login.max-attempts=5
# 账号锁定时间(分钟)
security.login.lock-duration-minutes=30
# 同一IP最大失败次数
security.login.ip-max-attempts=20

# ==================== CORS配置 ====================
# 生产环境用环境变量 CORS_ORIGINS 覆盖，多个用逗号分隔（如 http://118.31.186.244:8081,https://your-domain.com）
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

